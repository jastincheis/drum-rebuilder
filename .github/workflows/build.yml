name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: "macOS (Universal: Apple Silicon + Intel)"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Tests
        run: ./build/drb_tests_artefacts/Release/drb_tests
      - name: Package
        run: |
          cd build/DrumRebuilder_artefacts/Release
          ditto -c -k --keepParent "Standalone/Drum Rebuilder.app" "$GITHUB_WORKSPACE/DrumRebuilder-macOS-Standalone.zip"
          ditto -c -k --keepParent "VST3/Drum Rebuilder.vst3" "$GITHUB_WORKSPACE/DrumRebuilder-macOS-VST3.zip"
          ditto -c -k --keepParent "AU/Drum Rebuilder.component" "$GITHUB_WORKSPACE/DrumRebuilder-macOS-AU.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: DrumRebuilder-macOS
          path: DrumRebuilder-macOS-*.zip

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: arm64,   runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libxi-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 4
      - name: Tests
        run: ./build/drb_tests_artefacts/Release/drb_tests
      - name: Package
        run: tar -C build/DrumRebuilder_artefacts/Release -czf DrumRebuilder-Linux-${{ matrix.arch }}.tar.gz Standalone VST3
      - uses: actions/upload-artifact@v4
        with:
          name: DrumRebuilder-Linux-${{ matrix.arch }}
          path: DrumRebuilder-Linux-${{ matrix.arch }}.tar.gz

  windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Tests
        run: build/drb_tests_artefacts/Release/drb_tests.exe
      - name: Package
        run: Compress-Archive -Path 'build/DrumRebuilder_artefacts/Release/Standalone', 'build/DrumRebuilder_artefacts/Release/VST3' -DestinationPath DrumRebuilder-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DrumRebuilder-Windows
          path: DrumRebuilder-Windows.zip
